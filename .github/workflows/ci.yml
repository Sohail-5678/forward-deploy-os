name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit, property, red-team and API tests
        run: npm test
      - name: Benchmark drift check (fails if results.json is stale)
        run: npm run bench:check
      - run: npx playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python Playwright for the exported script test
        run: pip install playwright && python -m playwright install chromium
      - name: Agent runner, MCP server and exported scripts
        run: npm run test:integration
      - run: npm run build
        env:
          CHECKPOINT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      - name: E2E (production build)
        run: npx playwright test
        env:
          CI: "true"
          CHECKPOINT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
